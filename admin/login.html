<!DOCTYPE html>

<html>

<head>

<title>
Cryovix Fixify Admin Login
</title>


<meta name="viewport" content="width=device-width,initial-scale=1">


<style>

body{

margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#eef6ff;
font-family:Arial;

}


.login-box{

background:white;
padding:30px;
width:330px;
border-radius:15px;
box-shadow:0 10px 30px #0002;

}


h2{

text-align:center;
color:#0066ff;

}


input{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;

}


button{

width:100%;
padding:12px;
background:#0066ff;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;

}


button:hover{

background:#004ecc;

}


#error{

color:red;
text-align:center;

}


</style>


</head>


<body>


<div class="login-box">


<h2>
🔐 Admin Login
</h2>


<input 
id="email"
type="email"
placeholder="Admin Email">


<input 
id="password"
type="password"
placeholder="Password">


<button onclick="login()">

Login

</button>


<p id="error"></p>


</div>



<script type="module">


import {auth}
from "./firebase-config.js";


import {

signInWithEmailAndPassword

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



window.login = async function(){


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



try{


await signInWithEmailAndPassword(

auth,

email,

password

);



location.href="admin.html";



}

catch(error){


document.getElementById("error").innerHTML=

"❌ Invalid Admin Login";


}



}



</script>


</body>

</html>
