```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Service - Cryovix Fixify</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fb;
    padding:20px;
}

.booking-container{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#0d6efd;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

textarea{
    resize:none;
    height:100px;
}

.service-box{
    background:#f8f9fa;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-bottom:20px;
}

.service-box h3{
    margin-bottom:10px;
}

.submit-btn{
    width:100%;
    padding:14px;
    border:none;
    background:#ff6b00;
    color:white;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
}

.submit-btn:hover{
    background:#e55d00;
}

</style>

</head>
<body>

<div class="booking-container">

<h1>Book Your Service</h1>

<div class="service-box">

    <h3>Selected Service</h3>

    <div class="form-group">
        <label>Service Name</label>
        <input type="text" id="serviceName" readonly>
    </div>

    <div class="form-group">
        <label>Service Price</label>
        <input type="text" id="servicePrice" readonly>
    </div>

    <div class="form-group">
        <label>Estimated Time</label>
        <input type="text" id="serviceTime" readonly>
    </div>

</div>

<form id="bookingForm">

    <div class="form-group">
        <label>Customer Name</label>
        <input type="text" id="customerName" required>
    </div>

    <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="customerPhone" required>
    </div>

    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="customerEmail">
    </div>

    <div class="form-group">
        <label>Address</label>
        <textarea id="customerAddress" required></textarea>
    </div>

    <div class="form-group">
        <label>Preferred Date</label>
        <input type="date" id="bookingDate" required>
    </div>

    <div class="form-group">
        <label>Preferred Time</label>
        <input type="time" id="bookingTime" required>
    </div>

    <button type="submit" class="submit-btn">
        Confirm Booking
    </button>

</form>

</div>

<script>

// Auto Fill Service Data
document.getElementById("serviceName").value =
localStorage.getItem("serviceName") || "";

document.getElementById("servicePrice").value =
localStorage.getItem("servicePrice") || "";

document.getElementById("serviceTime").value =
localStorage.getItem("serviceTime") || "";

// Save Booking
document.getElementById("bookingForm")
.addEventListener("submit",function(e){

e.preventDefault();

const booking = {

service : document.getElementById("serviceName").value,
price : document.getElementById("servicePrice").value,
time : document.getElementById("serviceTime").value,

name : document.getElementById("customerName").value,
phone : document.getElementById("customerPhone").value,
email : document.getElementById("customerEmail").value,
address : document.getElementById("customerAddress").value,

bookingDate : document.getElementById("bookingDate").value,
bookingTime : document.getElementById("bookingTime").value,

createdAt : new Date().toLocaleString()

};

let bookings =
JSON.parse(localStorage.getItem("bookings")) || [];

bookings.push(booking);

localStorage.setItem(
"bookings",
JSON.stringify(bookings)
);

alert("Booking Successfully Submitted!");

window.location.href = "my-bookings.html";

});

</script>

</body>
</html>
