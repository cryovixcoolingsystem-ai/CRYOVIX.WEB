<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track My Bookings - Cryovix Fixify</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f1f5f9; padding: 20px; }
        .customer-card { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* Auth UI */
        #loginBox { text-align: center; padding: 40px 20px; }
        #loginBox h2 { color: #0f172a; margin-bottom: 10px; }
        #loginBox p { color: #64748b; margin-bottom: 25px; font-size: 14px; }
        .btn-google { background: #4285f4; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
        .btn-google:hover { background: #357ae8; }

        /* User Header */
        #dashboardBox { display: none; }
        .user-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px; }
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 42px; height: 42px; border-radius: 50%; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }

        /* Status Badges */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; text-transform: uppercase; }
        .badge-pending { background: #fef3c7; color: #d97706; }
        .badge-confirmed { background: #dcfce7; color: #15803d; }
        .badge-completed { background: #e0e7ff; color: #4338ca; }

        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
        th { background: #f8fafc; font-weight: 700; color: #475569; }
        .no-data { text-align: center; color: #64748b; padding: 25px; }
    </style>
</head>
<body>

    <div class="customer-card">
        
        <!-- GOOGLE LOGIN SECTION -->
        <div id="loginBox">
            <h2><i class="fa-solid fa-calendar-check" style="color: #4f46e5;"></i> Cryovix Fixify Tracking</h2>
            <p>Apni booked services aur status dekhne ke liye Google Email se Login karein.</p>
            <button onclick="loginWithGoogle()" class="btn-google">
                <i class="fa-brands fa-google"></i> Continue with Google
            </button>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardBox">
            <div class="user-header">
                <div class="user-profile">
                    <img id="userImg" class="user-avatar" src="" alt="Profile">
                    <div>
                        <h4 id="userName" style="color: #0f172a;">CRYOVIX FIXIFY</h4>
                        <small id="userEmail" style="color: #64748b;">user@gmail.com</small>
                    </div>
                </div>
                <button onclick="logout()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>

            <h3 style="margin-bottom: 15px; color: #1e293b;">My Bookings Status</h3>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Service & Price</th>
                            <th>Date & Time Slot</th>
                            <th>Address</th>
                            <th>Booking Status</th>
                            <th>Assigned Technician</th>
                        </tr>
                    </thead>
                    <tbody id="customerTableBody">
                        <tr><td colspan="5" class="no-data"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Firebase App, Auth, Firestore & Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // Aapki Corrected Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDFxFdt_0hEzJnR3Ze-GfX_1uCzW_lgfnE",
            authDomain: "cryovix-fixify.firebaseapp.com",
            databaseURL: "https://cryovix-fixify-default-rtdb.firebaseio.com",
            projectId: "cryovix-fixify",
            storageBucket: "cryovix-fixify.firebasestorage.app",
            messagingSenderId: "871696054329",
            appId: "1:871696054329:web:35bf20b5f84b128d6875e8",
            measurementId: "G-D5KT0KESEP"
        };

        // Firebase Initialize
        firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        const rtdb = firebase.database(); // Fiber Realtime Database

        const TELEGRAM_CHAT_ID = "8528476017"; 

        // Google Sign-In
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(result => {
                const user = result.user;
                
                // Fiber (Realtime Database) me sync
                rtdb.ref('users/' + user.uid).set({
                    name: user.displayName,
                    email: user.email,
                    photo: user.photoURL,
                    telegramId: TELEGRAM_CHAT_ID,
                    lastLogin: new Date().toISOString()
                });

            }).catch(error => {
                alert("Login Error: " + error.message);
            });
        }

        // Logout
        function logout() {
            auth.signOut().then(() => {
                document.getElementById('loginBox').style.display = 'block';
                document.getElementById('dashboardBox').style.display = 'none';
            });
        }

        // Auth Observer
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'block';

                document.getElementById('userName').innerText = user.displayName || "CRYOVIX FIXIFY";
                document.getElementById('userEmail').innerText = user.email;
                document.getElementById('userImg').src = user.photoURL || "https://via.placeholder.com/40";

                fetchUserBookings(user.email);
            } else {
                document.getElementById('loginBox').style.display = 'block';
                document.getElementById('dashboardBox').style.display = 'none';
            }
        });

        // Fetch User Bookings
        function fetchUserBookings(email) {
            const tbody = document.getElementById('customerTableBody');

            db.collection("customers").where("email", "==", email).onSnapshot(snapshot => {
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" class="no-data">Koi booking nahi mili.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                snapshot.forEach(doc => {
                    const data = doc.data();

                    // Fiber Sync
                    rtdb.ref('bookings/' + doc.id).set({
                        ...data,
                        telegramChatId: TELEGRAM_CHAT_ID
                    });

                    const status = data.status || 'Pending';
                    let statusBadge = `<span class="badge badge-pending">Pending</span>`;
                    if (status.toLowerCase() === 'confirmed') statusBadge = `<span class="badge badge-confirmed">Confirmed</span>`;
                    if (status.toLowerCase() === 'completed') statusBadge = `<span class="badge badge-completed">Completed</span>`;

                    const technician = data.technicianName 
                        ? `<strong>${data.technicianName}</strong>` 
                        : `<span style="color:#94a3b8;">Not Assigned</span>`;

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${data.service}</strong><br><strong style="color:#166534;">${data.price}</strong></td>
                            <td>${data.date}<br><small style="color:#64748b;">${data.timeSlot}</small></td>
                            <td>${data.address}, ${data.city || ''}</td>
                            <td>${statusBadge}</td>
                            <td>${technician}</td>
                        </tr>
                    `;
                });
            });
        }
    </script>
</body>
</html>
