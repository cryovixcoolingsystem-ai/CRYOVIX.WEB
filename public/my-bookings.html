<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Cryovix Fixify</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f1f5f9; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .user-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-pending { background: #fef3c7; color: #d97706; }
        .badge-confirmed { background: #dcfce7; color: #15803d; }
        .badge-completed { background: #e0e7ff; color: #4338ca; }
        .badge-cancelled { background: #fee2e2; color: #dc2626; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
        th { background: #f8fafc; font-weight: 700; color: #475569; }
        .btn-google { background: #4285f4; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginBox" style="text-align: center; padding: 30px;">
            <h2>Cryovix Fixify Tracking</h2>
            <p style="margin: 10px 0 20px; color: #64748b;">Login with Google to view your bookings</p>
            <button onclick="login()" class="btn-google"><i class="fa-brands fa-google"></i> Login with Google</button>
        </div>

        <div id="dashboardBox" style="display: none;">
            <div class="user-header">
                <div>
                    <h3 id="userName">Welcome</h3>
                    <small id="userEmail" style="color: #64748b;"></small>
                </div>
                <button onclick="logout()" style="background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer;">Logout</button>
            </div>

            <h3 style="margin-bottom: 15px;">My Service Bookings</h3>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Service & Price</th>
                            <th>Date & Slot</th>
                            <th>Address</th>
                            <th>Status</th>
                            <th>Technician</th>
                        </tr>
                    </thead>
                    <tbody id="bookingTableBody">
                        <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6i1kfeHbjfnpoGEhKA547RfiEs4YPxWs",
            authDomain: "cryovix-fixify-9568.firebaseapp.com",
            projectId: "cryovix-fixify-9568",
            storageBucket: "cryovix-fixify-9568.firebasestorage.app",
            messagingSenderId: "1085216868854",
            appId: "1:1085216868854:web:a64ade2b08a871bfdf9fd7"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'block';
                document.getElementById('userName').innerText = user.displayName || "User";
                document.getElementById('userEmail').innerText = user.email;

                // REALTIME LISTENER FOR CUSTOMER BOOKINGS
                db.collection("customers")
                  .where("userEmail", "==", user.email)
                  .onSnapshot(snapshot => {
                      const tbody = document.getElementById('bookingTableBody');
                      if (snapshot.empty) {
                          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b;">No bookings found.</td></tr>`;
                          return;
                      }

                      tbody.innerHTML = "";
                      snapshot.forEach(doc => {
                          const data = doc.data();
                          const status = (data.status || 'Pending').toLowerCase();
                          let badgeClass = 'badge-pending';
                          if (status === 'confirmed') badgeClass = 'badge-confirmed';
                          if (status === 'completed') badgeClass = 'badge-completed';
                          if (status === 'cancelled') badgeClass = 'badge-cancelled';

                          tbody.innerHTML += `
                              <tr>
                                  <td><strong>${data.service}</strong><br><small style="color:#166534; font-weight:bold;">${data.price}</small></td>
                                  <td>${data.date}<br><small style="color:#64748b;">${data.timeSlot}</small></td>
                                  <td>${data.address}</td>
                                  <td><span class="badge ${badgeClass}">${data.status}</span></td>
                                  <td>${data.technicianName ? '<strong>'+data.technicianName+'</strong>' : '<span style="color:#94a3b8;">Not Assigned</span>'}</td>
                              </tr>
                          `;
                      });
                  });
            } else {
                document.getElementById('loginBox').style.display = 'block';
                document.getElementById('dashboardBox').style.display = 'none';
            }
        });
    </script>
</body>
</html>
