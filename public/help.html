<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cryovix Fixify AI Help Center</title>

<link rel="stylesheet" href="assets/CSS/help.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="bg-animation"></div>

<header class="help-header">

    <div class="logo">
        <div class="logo-icon">
            <i class="fas fa-robot"></i>
        </div>

        <div>
            <h2>Cryovix AI</h2>
            <span>Smart Appliance Assistant</span>
        </div>
    </div>

    <div class="status">
        <span class="pulse"></span>
        Online
    </div>

</header>

<section class="hero-card">

    <div class="hero-icon">
        <i class="fas fa-brain"></i>
    </div>

    <h1>How can I help you today?</h1>

    <p>
        Get instant help for AC, Refrigerator,
        Washing Machine, Microwave and Chimney.
    </p>

</section>

<section class="quick-actions">

    <button class="action-btn">
        <i class="fas fa-snowflake"></i>
        AC Not Cooling
    </button>

    <button class="action-btn">
        <i class="fas fa-tint"></i>
        Water Leakage
    </button>

    <button class="action-btn">
        <i class="fas fa-fire"></i>
        Gas Charging
    </button>

    <button class="action-btn">
        <i class="fas fa-tools"></i>
        Installation
    </button>

    <button class="action-btn">
        <i class="fas fa-exclamation-triangle"></i>
        Error Codes
    </button>

    <button class="action-btn">
        <i class="fas fa-cogs"></i>
        Compressor Issue
    </button>

</section>

<section class="chat-window">

    <div class="chat-header">

        <div class="assistant">

            <div class="assistant-avatar">
                <i class="fas fa-robot"></i>
            </div>

            <div>
                <h3>Cryovix AI Assistant</h3>
                <span>24/7 Available</span>
            </div>

        </div>

    </div>

    <div class="chat-body" id="chatBody">

        <div class="bot-message">
            👋 Hello! I am Cryovix AI. Ask me anything about your appliance problem.
        </div>

    </div>

    <div class="chat-input">

        <textarea
        id="userInput"
        placeholder="Ask your question..."
        rows="1"></textarea>

        <button id="voiceBtn">
            <i class="fas fa-microphone"></i>
        </button>

        <button id="sendBtn">
            <i class="fas fa-paper-plane"></i>
        </button>

    </div>

</section>

<script ></script>

</body>
</html>
