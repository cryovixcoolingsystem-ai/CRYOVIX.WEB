<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cryovix Fixify</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-card {
            max-width: 400px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        .btn-submit { width: 100%; padding: 10px; background: #6366f1; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Customer Login</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="example@mail.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn-submit">Login</button>
    </form>
    <p style="font-size: 12px; margin-top: 15px;">New user? <a href="register.html">Register here</a></p>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  
  const firebaseConfig = {
  apiKey: "AIzaSyA6i1kfeHbjfnpoGEhKA547RfiEs4YPxWs",
  authDomain: "cryovix-fixify-9568.firebaseapp.com",
  databaseURL: "https://cryovix-fixify-9568-default-rtdb.firebaseio.com",
  projectId: "cryovix-fixify-9568",
  storageBucket: "cryovix-fixify-9568.firebasestorage.app",
  messagingSenderId: "1085216868854",
  appId: "1:1085216868854:web:a64ade2b08a871bfdf9fd7",
  measurementId: "G-GPXDLR50SR"
};
  

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        const user = userCredential.user;
        alert("Login successful! Welcome " + user.email);
        window.location.href = "account.html"; // Redirect to Account page
      })
      .catch((error) => {
        alert("Login Failed: " + error.message);
      });
  });
</script>
<script type="module">

import {
    auth,
    googleProvider,
    signInWithPopup
} from "./js/firebase.js";


document
.getElementById("googleLogin")
.addEventListener("click", async () => {

    try {

        const result =
            await signInWithPopup(
                auth,
                googleProvider
            );

        const user = result.user;

        console.log("Logged in:", user.email);

        // Login के बाद home
        window.location.href = "index.html";

    } catch (error) {

        console.error(error);

        alert(error.message);

    }

});

</script>
</body>
</html>
