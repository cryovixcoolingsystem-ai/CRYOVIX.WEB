<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cryovix Fixify | Highly Secure Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body{ height:100vh; display:flex; justify-content:center; align-items:center; background:linear-gradient(135deg,#001219,#005f73,#0a9396,#94d2bd); overflow:hidden; }
.background{ position:absolute; width:100%; height:100%; overflow:hidden; }
.circle{ position:absolute; border-radius:50%; background:rgba(255,255,255,.08); animation:float 8s infinite linear; }
.circle:nth-child(1){ width:250px; height:250px; left:10%; top:10%; }
.circle:nth-child(2){ width:180px; height:180px; right:15%; top:20%; }
.circle:nth-child(3){ width:300px; height:300px; bottom:-80px; left:40%; }
@keyframes float{ 0%{transform:translateY(0);} 50%{transform:translateY(-30px);} 100%{transform:translateY(0);} }

.login-box{ position:relative; width:430px; background:rgba(255,255,255,.15); backdrop-filter:blur(18px); border-radius:20px; padding:40px; box-shadow:0 15px 40px rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.25); z-index:10; }
.logo{ font-size:30px; font-weight:700; text-align:center; color:#fff; margin-bottom:5px; }
.sub{ text-align:center; color:#ddd; margin-bottom:25px; font-size:14px; }
.input-box{ position:relative; margin-bottom:18px; }
.input-box i{ position:absolute; left:15px; top:15px; color:#0a9396; }
.input-box input, .input-box select{ width:100%; padding:14px 14px 14px 45px; border:none; outline:none; border-radius:10px; font-size:14px; background:#fff; }
.login-btn{ width:100%; padding:15px; background:#0a9396; border:none; border-radius:10px; font-size:16px; font-weight:600; color:#fff; cursor:pointer; transition:.3s; margin-top:10px; }
.login-btn:hover{ background:#005f73; }
.error-msg{ color:#ff4d4d; font-size:13px; text-align:center; margin-bottom:15px; display:none; background:rgba(0,0,0,0.4); padding:8px; border-radius:6px; }
.extra{ display:flex; justify-content:space-between; margin-top:18px; }
.extra a{ text-decoration:none; color:#fff; font-size:13px; }
.footer{ margin-top:25px; text-align:center; color:#fff; font-size:12px; }
</style>
</head>
<body>

<div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<div class="login-box">
    <div class="logo">❄ Cryovix Fixify</div>
    <p class="sub"><i class="fa-solid fa-shield-halved"></i> Secured Admin Portal</p>
    
    <div id="errorAlert" class="error-msg"></div>

    <form id="loginForm">
        <div class="input-box">
            <i class="fa fa-user"></i>
            <input type="email" id="email" placeholder="Admin Email" required autocomplete="off">
        </div>

        <div class="input-box">
            <i class="fa fa-lock"></i>
            <input type="password" id="password" placeholder="Password" required>
        </div>

        <div class="input-box">
            <i class="fa fa-key"></i>
            <input type="password" id="secretKey" placeholder="Admin Security Pin" required>
        </div>

        <div class="input-box">
            <i class="fa fa-user-shield"></i>
            <select id="role">
                <option value="superadmin">Super Admin</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">LOG IN SECURELY</button>
    </form>

    <div class="extra">
        <a href="#">Forgot Credentials?</a>
        <a href="../index.html">Back to Main Website</a>
    </div>

    <div class="footer">
        © 2026 Cryovix Fixify | Encrypted Session Access
    </div>
</div>

<script>
// ADMIN CREDENTIALS DATABASE (For production, connect to Backend/Firebase)
const ADMIN_ACCOUNTS = {
    "admin@cryovix.com": { password: "CryoVix#Fixify@2026!Secure$91", pin: "956814", role: "superadmin", path: "super-admin/dashboard.html" },

};

document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    let email = document.getElementById("email").value.trim().toLowerCase();
    let password = document.getElementById("password").value;
    let pin = document.getElementById("secretKey").value;
    let role = document.getElementById("role").value;
    let errorAlert = document.getElementById("errorAlert");
    let loginBtn = document.getElementById("loginBtn");

    errorAlert.style.display = "none";
    loginBtn.innerText = "Authenticating...";

    setTimeout(() => {
        // Validation Check
        if(ADMIN_ACCOUNTS[email]) {
            let account = ADMIN_ACCOUNTS[email];
            
            if(account.password === password && account.pin === pin && account.role === role) {
                // Generate Secure Session Token
                const sessionToken = "CRYOVIX_AUTH_" + Math.random().toString(36).substring(2) + Date.now();
                const sessionExpiry = Date.now() + (30 * 60 * 1000); // Valid for 30 minutes

                sessionStorage.setItem("cryovix_auth_token", sessionToken);
                sessionStorage.setItem("cryovix_admin_email", email);
                sessionStorage.setItem("cryovix_admin_role", role);
                sessionStorage.setItem("cryovix_session_exp", sessionExpiry);

                // Clear input sensitivity
                document.getElementById("password").value = "";
                document.getElementById("secretKey").value = "";

                // Redirect to exact dashboard
                window.location.href = account.path;
            } else {
                showError("Invalid Password, Security Pin, or Role!");
            }
        } else {
            showError("Access Denied: Admin Account Not Found!");
        }
    }, 600);
});

function showError(msg) {
    let errorAlert = document.getElementById("errorAlert");
    let loginBtn = document.getElementById("loginBtn");
    errorAlert.innerText = msg;
    errorAlert.style.display = "block";
    loginBtn.innerText = "LOG IN SECURELY";
}
</script>
<script>
// DASHBOARD SECURITY GUARD SCRIPT
(function checkAdminAuth() {
    const token = sessionStorage.getItem("cryovix_auth_token");
    const exp = sessionStorage.getItem("cryovix_session_exp");

    // Agar token missing hai ya session expire ho chuka hai
    if (!token || !exp || Date.now() > parseInt(exp)) {
        sessionStorage.clear();
        alert("Session expired or Unauthorized access! Please login again.");
        window.location.href = "../admin-login.html"; // Login Page Par Bhej Do
    }
})();
</script>

</body>
</html>
