<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service - Cryovix Fixify</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-light: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); padding: 20px; }
        .booking-container { max-width: 600px; margin: 20px auto; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 30px; border: 1px solid var(--border); }
        .booking-header { text-align: center; margin-bottom: 25px; }
        .booking-header h2 { font-size: 24px; color: var(--text-main); margin-bottom: 8px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        .service-summary-card { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 15px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
        .service-summary-card .service-title { font-weight: 700; font-size: 16px; color: #166534; display: flex; align-items: center; gap: 8px; }
        .service-meta-box { display: flex; justify-content: space-between; background: #ffffff; padding: 10px 14px; border-radius: 8px; border: 1px solid #dcfce7; }
        .meta-item { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #0f172a; }
        #map { height: 200px; width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 8px; }
        .location-btn { background: #10b981; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .btn-submit { width: 100%; background: var(--primary); color: white; padding: 14px; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; transition: background 0.3s ease; margin-top: 10px; }
        .btn-submit:hover { background: var(--primary-dark); }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
        .success-message { display: none; text-align: center; background: #d1fae5; color: #065f46; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="booking-container">
        <div class="booking-header">
            <h2><i class="fa-solid fa-calendar-check" style="color: var(--primary);"></i> Complete Your Booking</h2>
            <p style="font-size: 13px; color: var(--text-muted);">Enter details & select your location</p>
        </div>

        <div id="successMsg" class="success-message">
            <i class="fa-solid fa-circle-check"></i> Booking confirmed! Thank you.
        </div>

        <!-- action="javascript:void(0);" prevents default browser page reload -->
        <form id="bookingForm" action="javascript:void(0);">
            <div class="service-summary-card">
                <div class="service-title">
                    <i class="fa-solid fa-screwdriver-wrench"></i> <span id="displayService">General Service</span>
                </div>
                <div class="service-meta-box">
                    <div class="meta-item"><i class="fa-solid fa-tag" style="color: #166534;"></i> <span id="displayPrice">₹499</span></div>
                    <div class="meta-item"><i class="fa-solid fa-clock" style="color: #166534;"></i> <span id="displayOffer">Standard Rate</span></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="custName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="custPhone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Preferred Date</label>
                    <input type="date" id="custDate" required>
                </div>
                <div class="form-group">
                    <label>Time Slot</label>
                    <select id="custSlot">
                        <option>09:00 AM - 11:00 AM</option>
                        <option>11:00 AM - 01:00 PM</option>
                        <option>02:00 PM - 04:00 PM</option>
                        <option>04:00 PM - 07:00 PM</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Complete Address</label>
                <textarea id="custAddress" rows="2" placeholder="House No, Building, Street Name" required></textarea>
            </div>

            <div class="form-group">
                <label>City</label>
                <input type="text" id="custCity" value="Mumbai" required>
            </div>

            <div class="form-group">
                <label>Live Location Link (Optional)</label>
                <button type="button" class="location-btn" id="geoBtn"><i class="fa-solid fa-location-crosshairs"></i> Detect My Live GPS</button>
                <input type="hidden" id="googleMapLink" value="Not Shared">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Confirm & Book Now</button>
        </form>
    </div>

    <!-- Firebase App & Firestore Compatibility SDKs (Non-module for max stability) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // 1. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDFxFdt_0hEzJnR3Ze-GfX_1uCzW_lgfnE",
            authDomain: "cryovix-fixify.firebaseapp.com",
            projectId: "cryovix-fixify",
            storageBucket: "cryovix-fixify.firebasestorage.app",
            messagingSenderId: "871696054329",
            appId: "1:871696054329:web:4291aa97259ac0616875e8"
        };

        // Initialize Firebase
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (e) {
            console.error("Firebase init error:", e);
        }

        // 2. Extract Query Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const serviceName = urlParams.get('service') || 'General Home Service';
        const servicePrice = urlParams.get('price') || urlParams.get('offer') || '₹499';

        document.getElementById('displayService').innerText = serviceName;
        document.getElementById('displayPrice').innerText = servicePrice.startsWith('₹') ? servicePrice : '₹' + servicePrice;
        document.getElementById('displayOffer').innerText = urlParams.get('offer') ? 'Offer Applied' : 'Standard Rate';

        // 3. Handle GPS Location
        document.getElementById('geoBtn').addEventListener('click', function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    document.getElementById('googleMapLink').value = `https://maps.google.com/?q=${lat},${lng}`;
                    alert("📍 GPS Location captured successfully!");
                }, function() {
                    alert("Could not detect location. Please fill address manually.");
                });
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        });

        // 4. Form Submit Logic (Guaranteed No Automatic Page Redirect)
        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "Saving Booking...";
            submitBtn.disabled = true;

            const bookingData = {
                name: document.getElementById('custName').value.trim(),
                phone: document.getElementById('custPhone').value.trim(),
                service: serviceName,
                price: document.getElementById('displayPrice').innerText,
                date: document.getElementById('custDate').value,
                timeSlot: document.getElementById('custSlot').value,
                address: document.getElementById('custAddress').value.trim(),
                city: document.getElementById('custCity').value.trim(),
                googleMapLink: document.getElementById('googleMapLink').value,
                timestamp: new Date().toISOString()
            };

            try {
                // Step A: Save to Firestore
                if (db) {
                    await db.collection("customers").add(bookingData);
                } else {
                    throw new Error("Firebase SDK failed to load.");
                }

                // Step B: Send Telegram Alert
                const botToken = "8817937034:AAGI-_31FYe3frL_N5qINHK2eGEpeQrJIJk"; 
                const chatId = "8528476017";
                const telegramMsg = encodeURIComponent(
                    `🚨 NEW BOOKING ALERT\n\nName: ${bookingData.name}\nPhone: ${bookingData.phone}\nService: ${bookingData.service}\nPrice: ${bookingData.price}\nDate: ${bookingData.date}`
                );

                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${telegramMsg}`, { mode: 'no-cors' })
                    .catch(err => console.warn("Telegram failed:", err));

                // Step C: Display Success Message
                document.getElementById('successMsg').style.display = 'block';
                submitBtn.innerText = "Booking Confirmed ✓";
                alert("🎉 Success! Your booking has been saved.");

            } catch (err) {
                console.error("Booking error:", err);
                alert("⚠️ Booking Error: " + err.message + "\nPlease check Firestore database rules in Firebase Console.");
                submitBtn.innerText = "Confirm & Book Now";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
